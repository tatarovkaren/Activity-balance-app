name: Archive released source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bundle tracked source, working files, tests and docs with privacy filtering
        shell: bash
        run: |
          mkdir -p dist
          python3 scripts/archive-project.py
      - uses: actions/upload-artifact@v4
        with:
          name: activity-balance-source-${{ github.sha }}-privacy-filtered
          path: dist/*
          retention-days: 90
          if-no-files-found: error
