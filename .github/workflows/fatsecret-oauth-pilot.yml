name: FatSecret OAuth pilot checks
on:
  push:
    branches: [pilot/fatsecret-oauth-readonly]
    paths:
      - 'pilots/fatsecret-oauth/**'
      - '.github/workflows/fatsecret-oauth-pilot.yml'
  pull_request:
    paths:
      - 'pilots/fatsecret-oauth/**'
      - '.github/workflows/fatsecret-oauth-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.js
        working-directory: pilots/fatsecret-oauth
      - run: node --check lib/oauth.js && for f in api/*.js; do node --check "$f" || exit 1; done
        working-directory: pilots/fatsecret-oauth
