name: Chill Preview checks

on:
  pull_request:
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'docs/chill-preview.md'
      - 'package*.json'
      - '.github/workflows/chill-preview-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
