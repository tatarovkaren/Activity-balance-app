# Сообщение тестерам в Telegram-группу, когда в main выходит новая версия (поле version в package.json).
# Подробно и как включить — docs/release-notify.md.
name: Сообщить тестерам о новой версии

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      send:
        description: 'Отправить в группу (без галочки — только показать текст)'
        type: boolean
        default: false
      count:
        description: 'Сколько последних версий включить в сообщение'
        type: number
        default: 1

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Изменилась ли версия
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          SEND_INPUT: ${{ inputs.send }}
          HAS_TOKEN: ${{ secrets.TESTERS_BOT_TOKEN != '' && secrets.TESTERS_CHAT_ID != '' }}
        run: |
          now=$(node -p "require('./package.json').version")
          if [ "$EVENT" = "workflow_dispatch" ]; then
            send="$SEND_INPUT"
          else
            before=$(git show "$BEFORE:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
            echo "Было: ${before:-?}, стало: $now"
            if [ -n "$before" ] && [ "$before" != "$now" ]; then send=true; else send=false; fi
          fi
          if [ "$send" = "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Секреты TESTERS_BOT_TOKEN / TESTERS_CHAT_ID не заданы — сообщение не отправлено (см. docs/release-notify.md)."
            send=false
          fi
          echo "send=$send" >> "$GITHUB_OUTPUT"

      - name: Текст сообщения
        if: steps.check.outputs.send != 'true'
        env:
          COUNT: ${{ inputs.count || 1 }}
        run: node --experimental-strip-types --no-warnings scripts/release-notify.mjs --count "$COUNT"

      - name: Отправить в Telegram
        if: steps.check.outputs.send == 'true'
        env:
          TESTERS_BOT_TOKEN: ${{ secrets.TESTERS_BOT_TOKEN }}
          TESTERS_CHAT_ID: ${{ secrets.TESTERS_CHAT_ID }}
          COUNT: ${{ inputs.count || 1 }}
        run: node --experimental-strip-types --no-warnings scripts/release-notify.mjs --send --count "$COUNT"
